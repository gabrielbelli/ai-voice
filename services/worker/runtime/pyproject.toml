# The GPU runtime. This is the ONLY thing in the worker that imports torch.
#
# WHY 3.12 AND NOT SOMETHING NEWER. chatterbox-tts 0.1.7 hard-pins torch==2.6.0
# for python_version < "3.14". Python 3.14 would unlock torch>=2.9, but 3.14
# removed pkg_resources, which resemble-perth imports - a problem this repo has
# already hit and documented at services/tts-long/requirements.txt:30. So 3.12 is
# the only version that overrides nobody's pin.
#
# WHY cu126. torch 2.6.0 exists as a Windows wheel in cu124 and cu126 only; there
# is no 2.6.0+cu128 for Windows. cu126 is therefore forced, not chosen. Overriding
# to torch 2.9.1+cu130 resolves cleanly and saves about 600 MB of download and
# 1.7 GiB on disk, but it would mean a GPU/CPU output difference could be blamed
# on torch instead of on us, and the CPU service runs 2.6.0. Revisit once the
# idleness question this proof of concept exists to answer has been answered.
#
# gradio and pre-commit are hard runtime dependencies of chatterbox-tts 0.1.7, not
# extras. That is upstream's mistake and we inherit it, as services/tts-long
# already does. About 40 MB out of 5,600 - not worth stripping now.

[project]
name = "ai-voice-worker-runtime"
version = "0.1.0"
description = "Chatterbox on a GPU, as a child process that can be killed at any moment"
requires-python = "==3.12.*"
dependencies = [
    "chatterbox-tts==0.1.7",
    # torch and torchaudio are named here EXPLICITLY even though chatterbox-tts
    # already requires both. They have to be direct dependencies for the
    # [tool.uv.sources] mapping below to apply to them: uv only honours a source
    # mapping for a package the project itself depends on, and as a purely
    # transitive dependency torch resolves from PyPI instead.
    #
    # That is not a style point. The PyPI torch 2.6.0 win_amd64 wheel is the
    # CPU-ONLY build. Leaving these out produced a lock that resolved
    # torch 2.6.0 from pypi.org - verified, and it is the single most common way
    # this setup fails, because nothing about it looks wrong until the worker
    # turns out to be slower than the NAS it was meant to relieve. The pin below
    # is what forces download.pytorch.org/whl/cu126, and provision.ps1 asserts
    # torch.cuda.is_available() afterwards as a second line of defence.
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "numpy<2",
    "soundfile>=0.12",
]

[tool.uv]
# Resolve for Windows only. The runtime exists to run on one gaming PC and the
# torch cu126 wheels are win_amd64; without this the lock would have to satisfy
# macOS and Linux too, where those wheels do not exist. Narrowing it also means
# the lock can be generated and checked from any machine, which is how the one in
# this directory was produced.
environments = ["sys_platform == 'win32'"]

# Never build anything from source on a gaming PC: it would want a compiler the
# machine does not have, and a failed build at 4 GB into a download is the worst
# possible time to find out.
no-build = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchaudio = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
