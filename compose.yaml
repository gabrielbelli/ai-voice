# The voice stack as one TrueNAS app, behind one published port.
#
#   host:30080  ->  voice-gateway  ->  stt-stack:8000
#                                     tts-stack:8001
#                                     tts-long:8002
#   host:30081  ->  voice-ui       ->  voice-gateway:8080  (and MeTube, by host
#                                                           address, for links)
#
# WHAT CHANGED WHEN THE FIVE REPOSITORIES BECAME ONE. The image names, and
# nothing else:
#
#   ghcr.io/gabrielbelli/stt-stack      ->  ghcr.io/gabrielbelli/ai-voice-stt
#   ghcr.io/gabrielbelli/tts-stack      ->  ghcr.io/gabrielbelli/ai-voice-tts
#   ghcr.io/gabrielbelli/tts-long       ->  ghcr.io/gabrielbelli/ai-voice-tts-long
#   ghcr.io/gabrielbelli/voice-gateway  ->  ghcr.io/gabrielbelli/ai-voice-gateway
#
# services/ui joined later and was never a separate repository, so it has no
# old name: ghcr.io/gabrielbelli/ai-voice-ui.
#
# The SERVICE names below are deliberately NOT renamed to match the directory
# layout. They are DNS names on the app-internal network: `stt-stack` is what
# GATEWAY_STT_URL resolves, in this file, in the gateway's image defaults and
# in whatever is already deployed. They are also what the named volumes and
# container_names are keyed on, so renaming them would orphan the models
# already on disk to rename a hostname nobody types. A directory is not a
# hostname.
#
# THE OTHER REAL CHANGE HERE IS A DELETION, and it predates the monorepo. The
# three backends had `ports: ["8000:8000"]` and friends, so anything that could
# reach the NAS could reach all three directly and the gateway's "single auth
# boundary" was an aspiration — a client that skipped :8080 skipped the only
# process in this stack that checks a token. Removing those three `ports`
# entries is what makes the boundary real; adding voice-gateway is what keeps
# the stack usable afterwards. Neither half is any use alone.
#
# WHY THIS IS FREE. The three containers are one app and therefore already
# share a network, so `http://stt-stack:8000` already resolved from inside it.
# Nothing is being built to enable the gateway; a door is being closed.
#
# EVERY BACKEND SETTING BELOW IS COPIED VERBATIM from the deployed app
# (`app.config` for "stt-stack" over the TrueNAS middleware). Environment,
# cpus, mem_limit, volumes, tag, pull_policy, restart and healthcheck are
# unchanged, deliberately and to the character: this file is about the network
# boundary and must not be able to alter anything else.
#
# THE HEALTHCHECKS HERE ARE THE ONLY ONES THERE ARE. None of the five
# Containerfiles carries a HEALTHCHECK instruction, and that is not an
# oversight: HEALTHCHECK is not a field in the OCI image spec, and CI builds
# with buildah, whose default format is oci — so an instruction in a
# Containerfile is dropped silently on the way to the registry and `docker
# inspect` on a published image shows none. Delete a probe from this file and
# the container has no probe.
#
# READ THIS BEFORE DEPLOYING: the moment this applies, every client pointed at
# :8000, :8001 or :8002 breaks. That includes services/stt/bench/bench.py, the
# voice-integration suite, the gateway's own tests/test_live.py, and any Open
# WebUI or script configured with a backend port. They move to :30080, which
# serves the same paths (/transcribe, /speak, /voices, /jobs, /v1/...) with no
# rewriting.

services:

  # ------------------------------------------------------------ the door --
  #
  # The only service with a `ports` entry. If a second one ever appears here,
  # this file has stopped doing its job.
  voice-gateway:
    container_name: voice-gateway
    image: ghcr.io/gabrielbelli/ai-voice-gateway:pre
    pull_policy: always
    restart: unless-stopped
    ports:
      # 30080 on the host, not 8080. Port 8080 on orko is already bound by an
      # unrelated app (ix-rickroll), and docker refuses the bind rather than
      # sharing it: "Bind for 0.0.0.0:8080 failed: port is already allocated",
      # which fails the whole `up` and leaves the app in DEPLOYING with the
      # other three containers running and this one merely `created`.
      #
      # 30080 also matches the convention every other app on that box already
      # follows -- rackula 30323, metube 30097, gitea 30008, unifi 30072-75,
      # convertx 30154. The CONTAINER port stays 8080: nothing inside the image
      # or in the healthcheck below needs to know about the host mapping.
      - "30080:8080"
    environment:
      # Service names, not 127.0.0.1 and not the host address: these resolve on
      # the app-internal network, which is the only place the three still
      # listen once the ports below are gone.
      GATEWAY_STT_URL: http://stt-stack:8000
      GATEWAY_TTS_URL: http://tts-stack:8001
      GATEWAY_TTS_LONG_URL: http://tts-long:8002
      # GATEWAY_API_KEYS is deliberately NOT set here, because inventing a key
      # in a file that gets deployed is how a placeholder becomes production
      # credentials. Unset means authentication is OFF and every request is
      # accepted — for all three backends, since this is now the only process
      # that could check a token. Closing the ports without setting this buys
      # one door and no lock: it removes the bypass, not the anonymity.
      #
      # Set it to a comma-separated list before this is reachable from
      # anywhere untrusted, and expect the startup WARNING until you do:
      # GATEWAY_API_KEYS: sk-workstation,sk-laptop
    # 2 CPUs and 512 MB against the backends' 26 and 18 GB, because this
    # process moves bytes between two sockets and never holds them: uploads and
    # audio responses stream through, and the single buffered body is
    # /v1/audio/speech's JSON, which is kilobytes. The image itself is 283 MB
    # with no model and no torch in it.
    cpus: 2
    mem_limit: 512m
    healthcheck:
      # Its OWN localhost, like every service here. Note this endpoint answers
      # 200 even when a backend is down, on purpose — it reports `degraded` in
      # the body instead. A 503 here because tts-long is still loading would
      # have the orchestrator restart the gateway, which is the one container
      # that must stay up to report the outage.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      # Seconds, not minutes: there is no model to load. The backends' long
      # start_periods below are theirs and are not inherited.
      start_period: 30s
    # No depends_on. `service_healthy` on tts-long would hold the gateway down
    # for up to its 900 s start_period, and GET /health during a cold start is
    # exactly when someone most wants an answer. The gateway already returns a
    # named 503 with Retry-After for a backend that is not up yet, so starting
    # before them is the useful behaviour rather than a race to tolerate.

  # -------------------------------------------------------- the backends --
  #
  # `expose` replaces `ports` on all three. Being honest about what that does:
  # container-to-container traffic on a shared compose network works with or
  # without `expose`, so the enforcement is the ABSENCE of `ports`, not the
  # presence of `expose`. It is kept because it documents which port each
  # service actually listens on, and a reviewer reading this file for the
  # boundary should see a declaration, not a blank.
  #
  # Every healthcheck below points at 127.0.0.1 inside its own container. None
  # of them touches the gateway or a sibling: a container must never be
  # restarted because a different container is down, and a healthcheck aimed at
  # :8080 would turn one backend's outage into all four restarting.

  stt-stack:
    container_name: stt-stack
    image: ghcr.io/gabrielbelli/ai-voice-stt:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      STT_MODEL: parakeet
      STT_QUANTISATION: int8
      STT_THREADS: "8"
      STT_VAD: "1"
    cpus: 10
    mem_limit: 6g
    volumes:
      - stt-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 600s

  tts-stack:
    container_name: tts-stack
    image: ghcr.io/gabrielbelli/ai-voice-tts:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      TTS_LANGUAGE: en-us
      TTS_THREADS: "4"
      TTS_VOICE: bm_george
    cpus: 6
    mem_limit: 2g
    volumes:
      - tts-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s

  tts-long:
    container_name: tts-long
    image: ghcr.io/gabrielbelli/ai-voice-tts-long:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      HOME: /home/tts
      NUMBA_CACHE_DIR: /tmp/numba
      TTS_CFG_WEIGHT: "0.3"
      TTS_EXAGGERATION: "0.3"
      TTS_IDLE_TIMEOUT: "600"
      TTS_TEMPERATURE: "0.6"
      TTS_THREADS: "8"
      # Where a voice is a file. The registry resolves `voice: "gabriel"` to
      # /voices/gabriel.wav and hands it to Chatterbox as audio_prompt_path;
      # there is no per-request reference field on the wire at any layer.
      TTS_VOICE_DIR: /voices
    cpus: 10
    mem_limit: 10g
    volumes:
      - tts-long-models:/models
      - tts-long-out:/output
      # READ-ONLY, and shared with voice-ui, which is the only writer. One
      # writer means there is no case where two processes race on the same
      # clip, and it means a compromise of the heaviest container in the estate
      # cannot plant a file the lighter one will serve.
      #
      # The registry rescans when this directory's mtime changes rather than
      # once at startup, so a clip written by voice-ui — or copied in over SMB —
      # is resolvable on the next request instead of after a restart that costs
      # a ~60 s model load.
      - voices:/voices:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      # 900 s because the model is 6.5 GB and lazily loaded, and roughly 3 GB
      # is downloaded on the very first job this container ever runs.
      start_period: 900s

  # ---------------------------------------------------------- the page --
  #
  # THE SECOND `ports` ENTRY IN THIS FILE, and the comment at the top of the
  # gateway block says one appearing means this file has stopped doing its job.
  # That sentence was written about 8000, 8001 and 8002 — three backends that
  # could be reached DIRECTLY, skipping the only process in the stack that
  # checks a token. Those three are still closed and still have no `ports`.
  #
  # This is a browser origin, not a bypass. voice-ui reaches voice-gateway and
  # nothing else; it holds no key list and compares no token; it forwards the
  # caller's Authorization header untouched and asks the gateway itself whether
  # the key is good; and it can answer nothing the gateway would not have
  # answered. The boundary is exactly where it was. If a future edit gives this
  # container a URL for stt-stack, tts-stack or tts-long, that is the moment
  # this paragraph stops being true.
  voice-ui:
    container_name: voice-ui
    image: ghcr.io/gabrielbelli/ai-voice-ui:pre
    pull_policy: always
    restart: unless-stopped
    ports:
      # 30081, next to the gateway's 30080, and in the same 300xx band every
      # other app on orko uses — rackula 30323, metube 30097, gitea 30008,
      # unifi 30072-75, convertx 30154. The CONTAINER port is 8090 rather than
      # 8080 so that a file mapping both can never be ambiguous about which it
      # meant.
      - "30081:8090"
    environment:
      # A service name, on the app-internal network. The three backends are NOT
      # named here and must not be: this container talks to the gateway.
      UI_GATEWAY_URL: http://voice-gateway:8080

      # MeTube, by HOST ADDRESS. It is a separate TrueNAS app
      # (ix-metube-metube-1) with host_network:false and its web port published
      # on 30097, so it shares no DNS with this app — there is no `metube` name
      # to resolve, and `host.docker.internal` is absent without an explicit
      # extra_hosts entry. Put the NAS's LAN IP here.
      #
      # DELIBERATELY LEFT UNSET, like GATEWAY_API_KEYS above and for the same
      # reason: an address invented in a file that gets deployed is how a
      # placeholder becomes production configuration. Unset means the link box
      # is not rendered at all and the page says "link ingestion not
      # configured". File upload and both TTS paths never depend on it.
      #
      # BEFORE SETTING THIS, READ services/ui/README.md's security section.
      # MeTube has NO authentication of any kind — no auth, user, password or
      # token key exists in its configuration, and an unauthenticated GET
      # /history from off-NAS answers 200. Our path sits behind
      # GATEWAY_API_KEYS so this does not widen that hole, but it does make it
      # load-bearing, and the fix is a deployment one: unpublish 30097 or
      # firewall it to the NAS and reach it by LAN IP.
      # UI_METUBE_URL: http://192.0.2.10:30097

      # Ingest files land here rather than in the middle of the user's music
      # library. MeTube's AUDIO_DOWNLOAD_DIR defaults to %%DOWNLOAD_DIR and is
      # unset on this deployment, so /download/ and /audio_download/ are the
      # SAME directory; CUSTOM_DIRS and CREATE_CUSTOM_DIRS both default true,
      # so MeTube creates it for us.
      UI_METUBE_FOLDER: stt-ingest
      UI_VOICE_DIR: /voices
    # 1 CPU and 384 MB. This process serves one HTML file, streams bytes
    # between two sockets and occasionally spawns a yt-dlp probe that reads a
    # page of JSON. Nothing is buffered: the ingest path streams MeTube's file
    # straight into a multipart POST rather than holding 131 MB of podcast, and
    # audio decoding happens in the browser. The image has no torch, no numpy
    # and no ffmpeg.
    cpus: 1
    mem_limit: 384m
    volumes:
      # The reference-clip store, and it is NOT optional. Without a named
      # volume every cloned voice survives until the next restart and no
      # further, which is worse than not shipping the feature. voice-ui is the
      # only writer; tts-long mounts the same volume read-only below.
      - voices:/voices
    healthcheck:
      # Its OWN localhost, like every service here. This endpoint answers 200
      # even when the gateway is down — it reports that in the body instead. A
      # UI killed by the orchestrator because tts-long was restarting would be
      # gone at exactly the moment someone wanted to open the page and find out
      # why.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      # Seconds, not minutes: there is no model to load here either.
      start_period: 30s
    # No depends_on, for the gateway's reason: the page must be reachable
    # during a cold start, because that is exactly when someone wants to look
    # at the health pills and find out what is still loading.


# Unchanged, and named here so the deploy does not create new empty ones and
# silently orphan the models already on disk.
#
# `voices` is the one addition. The deployed compose mounted no voice volume at
# all, so tts-long's registry was ["default"] only and all thirteen OpenAI
# names aliased to the built-in speaker. Every cloned voice would have died on
# the next restart without it.
volumes:
  stt-models:
  tts-models:
  tts-long-models:
  tts-long-out:
  voices:
