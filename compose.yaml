# The voice stack as one TrueNAS app, behind one published port.
#
#   host:30080  ->  voice-gateway  ->  stt-stack:8000
#                                     tts-stack:8001
#                                     tts-long:8002
#
# ONE published port. voice-ui is behind the gateway now: the page is at
# http://host:30080/ and the gateway forwards `/`, `/ui/*` and `/ui/api/*` to
# it. voice-ui still talks to the gateway for the actual work, and to MeTube by
# host address for links.
#
# WHAT CHANGED WHEN THE FIVE REPOSITORIES BECAME ONE. The image names, and
# nothing else:
#
#   ghcr.io/gabrielbelli/stt-stack      ->  ghcr.io/gabrielbelli/calliope-stt
#   ghcr.io/gabrielbelli/tts-stack      ->  ghcr.io/gabrielbelli/calliope-tts
#   ghcr.io/gabrielbelli/tts-long       ->  ghcr.io/gabrielbelli/calliope-tts-long
#   ghcr.io/gabrielbelli/voice-gateway  ->  ghcr.io/gabrielbelli/calliope-gateway
#
# services/ui joined later and was never a separate repository, so it has no
# old name: ghcr.io/gabrielbelli/calliope-ui.
#
# The SERVICE names below are deliberately NOT renamed to match the directory
# layout. They are DNS names on the app-internal network: `stt-stack` is what
# GATEWAY_STT_URL resolves, in this file, in the gateway's image defaults and
# in whatever is already deployed. They are also what the named volumes and
# container_names are keyed on, so renaming them would orphan the models
# already on disk to rename a hostname nobody types. A directory is not a
# hostname.
#
# THE OTHER REAL CHANGE HERE IS A DELETION, and it predates the monorepo. The
# three backends had `ports: ["8000:8000"]` and friends, so anything that could
# reach the NAS could reach all three directly and the gateway's "single auth
# boundary" was an aspiration — a client that skipped :8080 skipped the only
# process in this stack that checks a token. Removing those three `ports`
# entries is what makes the boundary real; adding voice-gateway is what keeps
# the stack usable afterwards. Neither half is any use alone.
#
# WHY THIS IS FREE. The three containers are one app and therefore already
# share a network, so `http://stt-stack:8000` already resolved from inside it.
# Nothing is being built to enable the gateway; a door is being closed.
#
# EVERY BACKEND SETTING BELOW IS COPIED VERBATIM from the deployed app
# (`app.config` for "stt-stack" over the TrueNAS middleware). Environment,
# cpus, mem_limit, volumes, tag, pull_policy, restart and healthcheck are
# unchanged, deliberately and to the character: this file is about the network
# boundary and must not be able to alter anything else.
#
# THE HEALTHCHECKS HERE ARE THE ONLY ONES THERE ARE. None of the five
# Containerfiles carries a HEALTHCHECK instruction, and that is not an
# oversight: HEALTHCHECK is not a field in the OCI image spec, and CI builds
# with buildah, whose default format is oci — so an instruction in a
# Containerfile is dropped silently on the way to the registry and `docker
# inspect` on a published image shows none. Delete a probe from this file and
# the container has no probe.
#
# READ THIS BEFORE DEPLOYING: the moment this applies, every client pointed at
# :8000, :8001 or :8002 breaks. That includes services/stt/bench/bench.py, the
# voice-integration suite, the gateway's own tests/test_live.py, and any Open
# WebUI or script configured with a backend port. They move to :30080, which
# serves the same paths (/transcribe, /speak, /voices, /jobs, /v1/...) with no
# rewriting.

services:

  # ------------------------------------------------------------ the door --
  #
  # The only service with a `ports` entry. If a second one ever appears here,
  # this file has stopped doing its job.
  voice-gateway:
    container_name: voice-gateway
    image: ghcr.io/gabrielbelli/calliope-gateway:pre
    pull_policy: always
    restart: unless-stopped
    ports:
      # 30080 on the host, not 8080. Port 8080 on orko is already bound by an
      # unrelated app (ix-rickroll), and docker refuses the bind rather than
      # sharing it: "Bind for 0.0.0.0:8080 failed: port is already allocated",
      # which fails the whole `up` and leaves the app in DEPLOYING with the
      # other three containers running and this one merely `created`.
      #
      # 30080 also matches the convention every other app on that box already
      # follows -- rackula 30323, metube 30097, gitea 30008, unifi 30072-75,
      # convertx 30154. The CONTAINER port stays 8080: nothing inside the image
      # or in the healthcheck below needs to know about the host mapping.
      - "30080:8080"
    environment:
      # Service names, not 127.0.0.1 and not the host address: these resolve on
      # the app-internal network, which is the only place the three still
      # listen once the ports below are gone.
      GATEWAY_STT_URL: http://stt-stack:8000
      GATEWAY_TTS_URL: http://tts-stack:8001
      GATEWAY_TTS_LONG_URL: http://tts-long:8002
      GATEWAY_UI_URL: http://voice-ui:8090

      # WHICH `model` STRINGS GO TO tts-long. Default: "chatterbox,tts-long".
      # Everything else -- including a name nobody recognises -- goes to
      # tts-stack, which is right for a typo and became a trap the day a SECOND
      # long-form engine existed: someone types `chatterbox-turbo` at a
      # deployment that has not enabled it, falls off the end of this set and
      # gets KOKORO. A different engine, a different voice, no error anywhere.
      # The gateway therefore knows every name tts-long COULD own, enabled here
      # or not, and answers 404 naming this variable for the ones that are not.
      #
      # THIS SET AND TTS_ENGINES BELOW MUST AGREE, minus the `tts-long` alias.
      # It is the one place two services' model tables can drift, and
      # docs/tests/test_deployment.py asserts they have not.
      #
      # `voxtral` IS NOT IN THIS SET AND THAT IS THE WHOLE POINT OF THE
      # PARAGRAPH ABOVE WORKING. It is in the catalogue, it is tested, and this
      # deployment has retired it -- see
      # docs/adr/0010-the-third-engine-was-measured-and-retired.md. Because the
      # gateway knows every name tts-long COULD own, `model=voxtral` here is a
      # 404 naming this variable rather than a fall-through to Kokoro with a
      # voice Kokoro has never heard of. A deployment with a bigger card puts
      # the name back in BOTH this key and TTS_ENGINES, never in one of them.
      GATEWAY_LONG_MODELS: "chatterbox,tts-long,chatterbox-turbo"

      # HTTPS, with the certificate TrueNAS already manages for this host. Not
      # self-signed: a self-signed certificate is one every client is taught to
      # skip verification for, and a client taught to skip it keeps skipping it
      # against the real one too. This is the wildcard already on the box, so
      # https://orko.gabrielbelli.com:30080 validates with no flag anywhere.
      #
      # The key is 0400 root:root and stays that way -- loosening it would
      # weaken a file every service on this host shares. voice-entrypoint.sh
      # copies the pair to a private directory owned by uid 1000 while it is
      # still root, on every start, so a RENEWED certificate is picked up by a
      # restart rather than going stale in a copy someone made by hand.
      GATEWAY_TLS_CERT: /certs/cert-gabrielbelli_com.crt
      GATEWAY_TLS_KEY: /certs/cert-gabrielbelli_com.key
      # GATEWAY_API_KEYS is deliberately NOT set here, because inventing a key
      # in a file that gets deployed is how a placeholder becomes production
      # credentials. Unset means authentication is OFF and every request is
      # accepted — for all three backends, since this is now the only process
      # that could check a token. Closing the ports without setting this buys
      # one door and no lock: it removes the bypass, not the anonymity.
      #
      # SET. Two keys, so they can be rotated independently: the first is for
      # clients (an OpenAI-compatible tool, curl, a script), the second is the
      # one voice-ui presents on the reader's behalf. Revoking the first does
      # not lock anyone out of the page, and revoking the second does not break
      # a client mid-run.
      #
      # THESE ARE LIVE CREDENTIALS IN A TRACKED FILE. That is the trade this
      # comment used to warn against, made deliberately and with the reason
      # written down: this deployment ships compose content to TrueNAS, so a
      # ${VAR} here resolves to nothing at the far end and load_keys() treats
      # an empty value as a refusal to start. Before this repository is
      # published, these two lines are what has to be rotated and moved out.
      # GATEWAY_API_KEYS: sk-first,sk-second   # see GAB-632 before setting
    # 2 CPUs and 512 MB against the backends' 26 and 18 GB, because this
    # process moves bytes between two sockets and never holds them: uploads and
    # audio responses stream through, and the single buffered body is
    # /v1/audio/speech's JSON, which is kilobytes. The image itself is 283 MB
    # with no model and no torch in it.
    volumes:
      # Read-only, and the whole directory rather than two file mounts so a
      # renewal that replaces the files is seen. TrueNAS owns this path.
      - /etc/certificates:/certs:ro
    cpus: 2
    mem_limit: 512m
    healthcheck:
      # Its OWN localhost, like every service here. Note this endpoint answers
      # 200 even when a backend is down, on purpose — it reports `degraded` in
      # the body instead. A 503 here because tts-long is still loading would
      # have the orchestrator restart the gateway, which is the one container
      # that must stay up to report the outage.
      # https now, and verification is deliberately off for THIS probe only:
      # it dials 127.0.0.1, which no certificate for a hostname can match. The
      # check is "is this process answering", not "is the certificate right".
      test: ["CMD", "python", "-c", "import ssl,urllib.request;urllib.request.urlopen('https://127.0.0.1:8080/health',context=ssl._create_unverified_context())"]
      interval: 60s
      timeout: 30s
      retries: 3
      # Seconds, not minutes: there is no model to load. The backends' long
      # start_periods below are theirs and are not inherited.
      start_period: 30s
    # No depends_on. `service_healthy` on tts-long would hold the gateway down
    # for up to its 900 s start_period, and GET /health during a cold start is
    # exactly when someone most wants an answer. The gateway already returns a
    # named 503 with Retry-After for a backend that is not up yet, so starting
    # before them is the useful behaviour rather than a race to tolerate.

  # -------------------------------------------------------- the backends --
  #
  # `expose` replaces `ports` on all three. Being honest about what that does:
  # container-to-container traffic on a shared compose network works with or
  # without `expose`, so the enforcement is the ABSENCE of `ports`, not the
  # presence of `expose`. It is kept because it documents which port each
  # service actually listens on, and a reviewer reading this file for the
  # boundary should see a declaration, not a blank.
  #
  # Every healthcheck below points at 127.0.0.1 inside its own container. None
  # of them touches the gateway or a sibling: a container must never be
  # restarted because a different container is down, and a healthcheck aimed at
  # :8080 would turn one backend's outage into all four restarting.

  stt-stack:
    container_name: stt-stack
    image: ghcr.io/gabrielbelli/calliope-stt:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      STT_MODEL: parakeet
      STT_QUANTISATION: int8
      STT_THREADS: "8"
      STT_VAD: "1"
      # WHERE A FINISHED RUN IS RECORDED, and the reason there is no
      # depends_on beside it. tts-long keeps the store; this service posts one
      # record per finished run and forgets it, on a daemon thread with a
      # bounded queue, so a tts-long that is down or slow costs a record and
      # never a reply. The argument compose already makes for the gateway
      # above is stronger here: a log must never be a startup dependency of
      # the thing it logs. Unset the variable and the whole feature is a None
      # check on a hot path.
      RUNLOG_URL: http://tts-long:8002
      # THE LABEL EVERY RECORD CARRIES. Without it the default is
      # platform.node(), which inside a container is a random hex id that
      # changes on every recreate -- so the listing would show a new machine
      # every deploy. Set it here, once, next to the container it names.
      AIV_HOST_LABEL: orko
    cpus: 10
    mem_limit: 6g
    volumes:
      - stt-models:/models
      # WRITABLE GLOSSARY PROFILES, and until this line existed the four
      # /glossaries routes were complete and unusable. STT_GLOSSARY_DIR is
      # /glossaries in the image, the Containerfile deliberately does NOT
      # mkdir it, and profiles.writability() reports `writable: false` and
      # refuses every PUT and DELETE with 503 when nothing is mounted there.
      # So the service shipped a write API that answered "mount a volume" to
      # every write, which is the honest failure and still a dead feature.
      #
      # A NAMED VOLUME, like the other five in this file, and not a bind
      # mount. Nothing on the host needs to read these files -- they are
      # written over the API and read by this container only -- so naming a
      # host path here would add an ownership problem and a personal path to a
      # published file for no gain. A profile is a few hundred bytes and
      # MAX_BYTES caps one at 64 KB, so this volume never grows to anything.
      #
      # OWNERSHIP IS HANDLED, and it is worth saying where. Docker creates a
      # named volume's directory owned by root when the image has no directory
      # to copy ownership from, and this container's uvicorn runs as uid 1000,
      # so an unaided mount would land on profiles.writability()'s os.access
      # check and answer 503 with "not writable by uid 1000" -- a mounted
      # volume that still refuses writes, which is the confusing failure
      # rather than the clear one. VOICE_CHOWN_DIRS in the Containerfile
      # already lists /glossaries, so voice-entrypoint.sh chowns it to 1000
      # while it is still root, on every start.
      #
      # THE BUILT-INS ARE NOT IN HERE and must not be. `dictation` and `tech`
      # ship read-only at /etc/calliope/glossaries, and a custom file cannot
      # take one of their names: the write routes answer 409 and the registry
      # refuses the shadow. This volume holds only what somebody wrote.
      #
      # READ THE SECURITY NOTE BEFORE THIS IS REACHABLE FROM ANYWHERE
      # UNTRUSTED. GATEWAY_API_KEYS above is unset on this deployment, and the
      # backends run with STT_API_KEYS unset because the gateway is the only
      # process that checks a token. Unset plus this volume means an
      # unauthenticated write API on the LAN: anyone who can reach :30080 can
      # create, replace and delete profiles, and a profile changes what other
      # people's transcripts say. Set GATEWAY_API_KEYS.
      - stt-glossaries:/glossaries
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 600s

  tts-stack:
    container_name: tts-stack
    image: ghcr.io/gabrielbelli/calliope-tts:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      TTS_LANGUAGE: en-us
      # 8, NOT 4. Kokoro is the only engine in this stack that genuinely
      # parallelises: measured across a thread sweep on this host it went
      # 0.65x realtime at 2 threads, 1.30x at 4, 2.66x at 8 and 4.09x at 12,
      # with per-thread efficiency flat the whole way. Parakeet and Chatterbox
      # both flatten off well before that. It was the one engine here that was
      # starved.
      TTS_THREADS: "8"
      TTS_VOICE: bm_george
      # WHERE A FINISHED RUN IS RECORDED, and the reason there is no
      # depends_on beside it. tts-long keeps the store; this service posts one
      # record per finished run and forgets it, on a daemon thread with a
      # bounded queue, so a tts-long that is down or slow costs a record and
      # never a reply. The argument compose already makes for the gateway
      # above is stronger here: a log must never be a startup dependency of
      # the thing it logs. Unset the variable and the whole feature is a None
      # check on a hot path.
      RUNLOG_URL: http://tts-long:8002
      # THE LABEL EVERY RECORD CARRIES. Without it the default is
      # platform.node(), which inside a container is a random hex id that
      # changes on every recreate -- so the listing would show a new machine
      # every deploy. Set it here, once, next to the container it names.
      AIV_HOST_LABEL: orko
    # 8, MATCHING TTS_THREADS ABOVE, and both halves are required. ONNX Runtime
    # sizes its pool from the HOST core count, not the cgroup, so a limit on its
    # own leaves the threads fighting for a slice they are not allowed: more
    # threads than allotted CPU is slower than fewer, not merely capped. See
    # services/tts/README.md, "Limiting CPU use".
    cpus: 8
    mem_limit: 2g
    volumes:
      - tts-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s

  tts-long:
    container_name: tts-long
    image: ghcr.io/gabrielbelli/calliope-tts-long:pre
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      HOME: /home/tts
      NUMBA_CACHE_DIR: /tmp/numba
      TTS_CFG_WEIGHT: "0.3"
      TTS_EXAGGERATION: "0.3"
      TTS_IDLE_TIMEOUT: "600"
      TTS_TEMPERATURE: "0.6"
      TTS_THREADS: "8"
      # Where a voice is a file. The registry resolves `voice: "gabriel"` to
      # /voices/gabriel.wav and hands it to Chatterbox as audio_prompt_path;
      # there is no per-request reference field on the wire at any layer.
      TTS_VOICE_DIR: /voices

      # --------------------------------------------------- two engines --
      #
      # BASELINE AND TURBO, BOTH ON THE API, BOTH AS JOBS. The engine is the
      # `model` string on the wire — `chatterbox` and `chatterbox-turbo` — so a
      # caller can never receive an engine it did not name. It is not a
      # preference, it is never substituted, and it is not inferred from the
      # voice. The decision and its measurements are
      # docs/adr/0008-two-engines-and-both-stay-jobs.md.
      #
      # WHY TURBO IS STILL A JOB THOUGH IT PASSES REALTIME, and this is settled
      # rather than pending. Measured this week on spring's RTX 3070, fp32,
      # through the shipped path: 1.5426x realtime against baseline's 0.6531x —
      # 2.36 times quicker, and well past the point where a short request could
      # be answered down the socket. It stays a job ANYWAY, because 1.54x is the
      # figure on THAT CARD and that card belongs to somebody who is often using
      # it. A route that answers in nine seconds when spring is idle and four
      # minutes when spring is gaming is worse than one that always answers with
      # a job id. Nobody is to turn this into a synchronous route, a streamed
      # route, or a special case that sometimes waits.
      #
      # WHAT TURBO COSTS, all of it refused BY NAME rather than dropped:
      #   * ENGLISH ONLY. Its generate() has no language_id parameter at all and
      #     raises TypeError if handed one. 23 languages collapse to 1.
      #   * NO `exaggeration` AND NO `cfg_weight`. hp.emotion_adv is False, so
      #     the conditioning layer is never built and there is no CFG path;
      #     both values are accepted by generate(), logged as a warning and
      #     discarded. `temperature` survives and is the only delivery control
      #     turbo has.
      #   * QUIETER BY DESIGN, about 11 dB: -27 LUFS normalisation, RMS
      #     0.070-0.104 against baseline's 0.132-0.170.
      #   * A LONGER COLD LOAD: 67.5 s against baseline's 22.2 s, both timed on
      #     spring. See TTS_COLD_LOAD_SECONDS_CHATTERBOX_TURBO below.
      #   * A 5-SECOND FLOOR ON THE REFERENCE CLIP, which turbo asserts itself.
      #     GET /voices publishes each clip's length so a short one disables
      #     turbo on that voice with the reason attached, rather than failing a
      #     job that already has an id.
      # TTS_EXAGGERATION and TTS_CFG_WEIGHT above are UNCHANGED and stay set.
      # They are read only for engines whose catalogue entry declares that
      # control, so a turbo request never carries them and never 400s on a
      # value nobody typed.
      #
      # ------------------------- and a third that this deployment retired --
      #
      # VOXTRAL IS IN THE CATALOGUE AND IS NOT ENABLED HERE. Mistral
      # Voxtral-4B-TTS-2603, int4, through the github.com/TheMHD1/voxtral-int4
      # wrapper: twenty preset voices in nine languages, Portuguese among them.
      # It was built, wired to the wire, tested and measured on this project's
      # own hardware, and then taken off this deployment for three measured
      # reasons -- an 8265 MiB load peak on an 8192 MiB card that segfaults
      # whenever the desktop holds any VRAM, a transcript match against the
      # script that ranged 1.000 down to 0.682 with whole sentences missing,
      # and 0.104x realtime with no ability to clone. The evidence is
      # docs/adr/0010-the-third-engine-was-measured-and-retired.md, which
      # supersedes 0009-a-third-engine-that-cannot-run-here.md.
      #
      # THE ENGINE CODE IS STILL HERE AND IS STILL TESTED. Retiring it is this
      # line and the gateway's, not a deletion: a machine with a bigger card
      # enables it by adding `voxtral` to this key AND to GATEWAY_LONG_MODELS,
      # and by setting TTS_ALLOW_RUNNER_ONLY_ENGINES=1, since it has no local
      # lane and the boot check refuses that combination by default. Its
      # runner-side settings are recorded in ADR 0010 rather than left here as
      # keys nothing reads, because a key that is set and reaches no enabled
      # engine is the same lie as a lane configured against code that has gone.
      #
      # WHICH ENGINES THIS DEPLOYMENT OFFERS. Catalogue ids from
      # packages/common/voice_common/engines.py and nothing else; a name that is
      # not in the catalogue is a refusal to start, not a warning. Default:
      # "chatterbox".
      TTS_ENGINES: "chatterbox,chatterbox-turbo"
      # What `tts-long`, an absent `model`, and OpenAI's own three names
      # (`tts-1`, `tts-1-hd`, `gpt-4o-mini-tts`) all resolve to. Default: the
      # first name in TTS_ENGINES. Baseline, because it is the engine with no
      # substitute anywhere — 23 languages and the two expressive controls —
      # and because every client that reaches this service today gets exactly
      # what it got yesterday.
      TTS_DEFAULT_ENGINE: "chatterbox"
      # WHICH ENGINES THIS CONTAINER CAN RUN ON ITS OWN EIGHT THREADS, and it
      # must name every engine in TTS_ENGINES or the service refuses to start.
      # SPRING IS SPEED, NEVER AVAILABILITY. An engine that exists only while
      # somebody's gaming PC is on is a spring-shaped hole in the API, and the
      # first Friday evening that hole eats a job. Default: the value of
      # TTS_ENGINES, so the invariant holds unless somebody switches it off on
      # purpose with TTS_ALLOW_RUNNER_ONLY_ENGINES=1.
      #
      # THIS LINE NAMES EVERY ENGINE IN TTS_ENGINES, so nothing here depends on
      # spring at all and the opt-out below is not set. It reads as a repetition
      # of TTS_ENGINES and it is not one: the two keys answer different
      # questions, and the day they differ is the day an engine can disappear
      # with somebody's gaming PC.
      #
      # VOXTRAL COULD NEVER HAVE JOINED THIS LINE, which is worth keeping
      # written down now that it is retired: the temptation when re-enabling it
      # is to add it here too and get availability back. Not "not measured yet"
      # and not "slow": there is no processor path through this checkpoint at
      # all. torchao's int4 tile-packed layout calls
      # torch.cuda.get_device_capability() inside from_hp before any device
      # dispatch; HQQ is asserted to require exactly that layout; and even the
      # BF16 escape hatch calls torch.cuda.synchronize() unconditionally on the
      # decode path. Worse than all three, flow_steps and cfg_alpha exist ONLY
      # on the fast path -- the standard path is first-order Euler against the
      # second-order midpoint solver the 32 below was chosen against by ear --
      # so a processor lane would silently be a DIFFERENT SOLVER at a setting
      # nobody listened to. The estimate if every wall were solved is
      # 0.002-0.004x: a twenty-second clip in one and a half to three hours,
      # holding 8 GB resident and evicting chatterbox from
      # TTS_LOCAL_RESIDENT_MAX=1 the whole time. Adding it here would be the
      # `chatterbox-cpu` rung a second time -- a lane configured, published,
      # and unable to do work.
      TTS_LOCAL_ENGINES: "chatterbox,chatterbox-turbo"
      # TWO KEYS THAT BELONG TO A RUNNER-ONLY ENGINE ARE UNSET HERE, and their
      # absence is the whole of what retiring voxtral cost this file.
      #
      # TTS_ALLOW_RUNNER_ONLY_ENGINES was 1. It is the opt-out that lets
      # TTS_ENGINES name an engine TTS_LOCAL_ENGINES cannot run, and without it
      # that pairing is a refusal to start. Left set with nothing to excuse, it
      # would be a disarmed safety catch: the next engine with no local lane
      # would be added to TTS_ENGINES and boot cleanly instead of stopping. The
      # shipped default is 0 and this deployment is back on it.
      #
      # TTS_RUNNER_ONLY_DEADLINE_SECONDS was 900, which is also app/main.py's
      # own default. It fails an already-accepted job that has had no eligible
      # lane for that long -- a clock that can only start for an engine with no
      # local lane, and there is no such engine here. Re-enabling one is what
      # makes both keys mean something again.
      # HOW MANY LOCAL CHECKPOINTS STAY LOADED AT ONCE. Default 1, and this
      # deployment means it: baseline is ~6.6 GB resident here and turbo adds
      # 1.83 GB of weights plus an AutoTokenizer on top, against the 10g
      # mem_limit below. Two resident engines would fit only by luck, and the
      # thing that breaks when they do not is the OOM killer.
      TTS_LOCAL_RESIDENT_MAX: "1"

      # ------------------------------------------------- an optional GPU --
      #
      # UNSET, AND UNSET IS THE DEFAULT THAT MATTERS. With no TTS_RUNNER_HOST
      # this service is exactly what it was: every job runs on this CPU, and
      # app/remote.py is imported and never used. Setting the host is what
      # turns on the seam at app/main.py's _backend_for.
      #
      # The runner is an `idlegpu` agent (its own repository) on a machine with
      # a spare GPU, most likely somebody's gaming PC. It is NOT a cluster and
      # there is no broker: this service talks to that machine directly.
      #
      # WHAT THIS BUYS, MEASURED, so nobody switches it on expecting magic.
      # Chatterbox on an RTX 3070 ran at 0.56-0.72x realtime against 0.275x on
      # this container's eight threads. Two and a half times faster, on the one
      # component in this stack slower than realtime. Not an order of magnitude.
      #
      # AND WHAT IT COSTS. The runner hands its GPU back the instant its owner
      # touches the machine, so a job can be interrupted several times an
      # evening. That surfaces as still-queued and a retry, never as a failure,
      # and after TTS_RUNNER_MAX_WAIT it is spoken here instead. The CPU path in
      # app/synth.py is never removed and is what makes that safe.
      #
      # TLS ALWAYS, VERIFIED ALWAYS. The runner mints a self-signed certificate
      # into its own directory; `idlegpu fingerprint` on that machine prints the
      # SHA-256 to pin here. There is no setting that turns verification off.
      # Use TTS_RUNNER_CA_FILE instead if you have your own certificate authority.
      #
      # THIS DEPLOYMENT'S RUNNER. Everything here is this machine's, and the
      # commented block above is what a stranger reads instead.
      TTS_RUNNER_HOST: "192.168.1.117"
      TTS_RUNNER_PORT: "47600"
      # THE TRUST ROOT, and the only one. Verified from this host against the
      # live listener before it was written down: openssl s_client reported
      # the same SHA-256 that `idlegpu fingerprint` prints on the runner. It
      # changes if the certificate is ever reminted, and a mismatch is a
      # refused connection rather than a warning.
      TTS_RUNNER_FINGERPRINT: "db3493bff0fd794d9aca37fd0091d86822cf568ed10ac86b579f2735bea5badc"
      # A FILE, NOT A VALUE. This file is committed and published; the key is
      # not in it. Mounted read-only below, mode 0400, owned by the uid this
      # container runs as.
      TTS_RUNNER_API_KEY_FILE: /run/secrets/runner-key
      # THE idlegpu SERVICE ID PER ENGINE. TTS_RUNNER_SERVICE is the legacy
      # spelling and now means "the id for the `chatterbox` engine" and nothing
      # else; TTS_RUNNER_SERVICE_<ENGINE ID, UPPERCASED, HYPHENS TO
      # UNDERSCORES> is the general form. Both default to the engine id itself.
      #
      # SETTING THE TURBO ONE INSTALLS NOTHING. There is one lane and one card:
      # the agent registers services from its own worker.ini and must be
      # restarted after `idlegpu service install chatterbox-turbo` on that
      # machine. Until then the probe reports `no_such_service` for this id,
      # logs the install command once at WARNING, baseline keeps the card and
      # every turbo job runs on this container's CPU. That is the designed
      # first-day state, not a fault.
      TTS_RUNNER_SERVICE: chatterbox
      TTS_RUNNER_SERVICE_CHATTERBOX_TURBO: "chatterbox-turbo"
      # THERE IS NO THIRD LINE HERE ANY MORE. The runner table is built per
      # ENABLED engine, so a service id for an engine TTS_ENGINES does not
      # offer never reaches any lookup: it would be a setting that looks live,
      # answers no request, and tells the next reader that spring still serves
      # something it does not. The 12 GB install was deleted from that machine
      # too; see ADR 0010.
      TTS_RUNNER_POLL: "2"
      # TTS_RUNNER_CA_FILE: ""                 # or a CA bundle, if you have one
      # UNSET ON PURPOSE, AND THE "900" THAT SAT HERE IS WHY THIS COMMENT IS
      # LONGER THAN THE LINE. The default in app/remote.py is 300 s. Fifteen
      # minutes was the right number when a yield stopped the WHOLE SERVICE --
      # one worker, one job, so giving up on the runner meant re-speaking on
      # this CPU with everything submitted since queued behind it. Two lanes
      # ended that: a yield costs the runner lane and this host carries on. So
      # the trade is no longer "wait or stall the queue", it is fifteen minutes
      # of a progress bar that has not moved against five. Fifteen reads as a
      # hang, and the speech that finally arrives reads as an unexplained
      # restart. An override here would keep the old number in production
      # while the code says 300, which is exactly what happened.
      # TTS_RUNNER_MAX_WAIT: "300"

      # ------------------------------------------- two lanes, not a ladder --
      #
      # THERE IS NO `runner_cpu` LANE AND SETTING ONE HERE WOULD BE A LIE THIS
      # FILE TOLD FOR MONTHS. Naming `runner_cpu` in TTS_BACKEND_ORDER turns on
      # nothing at all: dispatch.py builds lanes from a fixed set and that name
      # is not in it. It was documented here as a live rung with live knobs, so
      # an operator following this file's own advice configured a lane that
      # silently did no work. Two reasons it went, both in
      # docs/adr/0007-two-lanes-not-three-rungs.md: measured, the runner's
      # Ryzen 7 5700X3D ran Chatterbox at 0.271x realtime against 0.230x on
      # this container's eight Xeon threads -- five per cent, because the model
      # is autoregressive at batch one -- and the agent on that machine has
      # only ever registered `echo` and `chatterbox`, so every offer to
      # `chatterbox-cpu` was `no_such_service` for the whole life of the rung.
      #
      # BE EXACT ABOUT WHICH KEYS DIED, because this file got that wrong once
      # already and a rounded-up deletion is the same class of falsehood as the
      # rung was. Gone from the code entirely: TTS_RUNNER_CPU_MIN_PCT and
      # TTS_RUNNER_CPU_WHEN_BACKLOG_S. STILL PARSED, and still reaching a field
      # nothing can route work to: TTS_RUNNER_CPU_SERVICE (app/remote.py, still
      # defaulting to `chatterbox-cpu` and still building a second
      # RunnerClient at startup), TTS_RUNNER_CPU_MAX_WAIT (app/remote.py) and
      # TTS_REALTIME_FACTOR_RUNNER_CPU (app/main.py, still seeding a rate for a
      # lane that cannot be chosen). None of the three is set here and none of
      # them should be: setting one changes nothing a caller can observe except
      # the `cpu_service` field app/remote.py still publishes on /health, which
      # names a service the agent on spring has never registered. The honest
      # fix is in the code, not in this file — see ADR 0007's consequences,
      # which claimed the deletion that did not happen.
      #
      # Every line below is its documented default, written out because the
      # numbers are the routing policy and a reader should not have to open
      # app/main.py to find them.
      #
      # WHICH LANES EXIST -- a membership test, not an order. A ladder is what
      # made a third rung unreachable: `local` is always willing, so nothing
      # under it was ever asked. Leaving a name out switches that lane off;
      # "local" alone is local-only.
      # TTS_BACKEND_ORDER: "runner,local"
      # How much better the runner has to look before a job crosses the LAN.
      # Asymmetric on purpose: losing the runner mid-job costs a whole
      # re-speak, losing the local lane costs only slowness.
      # TTS_DISPATCH_MARGIN: "1.25"
      # The fixed price of the handover -- the reference clip, the lease, the
      # first poll. ADDED, never multiplied, and it is what keeps a
      # one-second job on this host.
      # TTS_RUNNER_HOP_S: "8"
      # How often a background thread asks the runner whether it is free, and
      # that question's own clock. Nothing asks a runner anything on a job's
      # thread: a machine that is ASLEEP rather than switched off accepts the
      # connection and says nothing, and the 30 s job timeout would then be
      # charged to a job that was always going to run here.
      # TTS_RUNNER_PROBE_S: "10"
      # TTS_RUNNER_OFFER_TIMEOUT: "3"
      # How long the runner lane is left alone after it hands a job back. Its
      # owner has just sat down; bouncing the next job off the same machine a
      # second later is how a queue becomes a stampede.
      # TTS_RUNNER_COOLDOWN_S: "30"
      # Streamed jobs stay on this host. A yield half way through a stream
      # cannot be re-run without sending a second file header into the middle
      # of somebody's file. "1" turns it on for anyone who wants to find out.
      # TTS_STREAM_ON_RUNNER: "0"
      # How long shutdown waits for the lanes. What is still running past this
      # is marked `cancelled`, never `failed`.
      # TTS_SHUTDOWN_GRACE_S: "20"
      # The seeds each rate starts from, until a finished job replaces them.
      # /health publishes engine_observations beside them: a count of zero says
      # the figure next to it is one of these and not a measurement.
      #
      # ONE RATE PER (LANE, ENGINE) PAIR, NOT PER LANE, and turbo is why. The
      # two engines are 2.36x apart on the same card; one average over both
      # describes no configuration that exists, and _sync_budget reading it
      # would accept a synchronous request at exactly the wrong moment. The
      # pair key wins over the lane key wins over the global one, so the two
      # lines below still mean what they always meant — the `chatterbox` seeds.
      # TTS_REALTIME_FACTOR_LOCAL: "0.21"        # this container, 8 Xeon threads
      # TTS_REALTIME_FACTOR_RUNNER: "0.70"       # spring, an RTX 3070
      #
      # TURBO'S TWO SEEDS, and only one of them is a measurement.
      #
      # 1.54 is measured: 1.5426x realtime on spring's RTX 3070 at fp32, this
      # week, through the shipped path. fp16 and bf16 were measured too and are
      # SLOWER — precision is a VRAM lever on an autoregressive model at batch
      # one, not a speed lever — so there is no precision knob here and there
      # is not going to be one.
      TTS_REALTIME_FACTOR_RUNNER_CHATTERBOX_TURBO: "1.54"
      # 0.45 IS THE ONE NUMBER IN THIS BLOCK THAT NOBODY MEASURED ON THIS BOX.
      # Turbo on a CPU has never been run on orko. It measured 0.53-0.55 on an
      # M-series laptop, and turbo is 3.0-3.2x baseline on the same CPU with
      # the same threads and the same clip, which puts orko somewhere around
      # 0.5-0.7. Seeded at the bottom of that range ON PURPOSE: a pessimistic
      # rate defers to a 202 rather than promising a synchronous answer this
      # container cannot deliver. `engine_observations` will publish 0 beside
      # it, which is the count saying out loud that it is a hypothesis. ONE
      # TURBO JOB FINISHED ON THIS HOST REPLACES IT.
      TTS_REALTIME_FACTOR_LOCAL_CHATTERBOX_TURBO: "0.45"
      # WHAT A COLD START COSTS THE CALLER WHO TRIGGERS IT, per engine, charged
      # against the synchronous budget only when that engine is not already
      # resident on that lane. Baseline's global default is 60 s and covers the
      # ~3 GB first-ever download as well as the load. Turbo's 68 is the 67.5 s
      # measured on spring — a 1.83 GB checkpoint plus an AutoTokenizer, against
      # 20.0 s warm and against baseline's 22.2 s on the same machine. It has
      # never been timed on this container; 68 is the conservative direction,
      # which is the right one for a number that decides whether somebody is
      # made to wait.
      TTS_COLD_LOAD_SECONDS_CHATTERBOX_TURBO: "68"
      # THERE IS NO VOXTRAL COLD LOAD, RATE OR QUALITY KEY BELOW, and that is a
      # deletion rather than an omission. A per-engine key is read only for an
      # engine TTS_ENGINES names, so with voxtral retired every one of them --
      # its 63-second cold load, its 0.104x runner rate, its two quality dials
      # -- would have been set, parsed by nothing and honoured by nothing,
      # while reading like live configuration. That is the defect this file has
      # shipped before in the other direction: a lane recommended here after
      # the code behind it had gone.
      #
      # THE SETTINGS THEMSELVES ARE NOT LOST, because losing them would cost
      # the evenings that were spent listening. They are recorded in
      # docs/adr/0010-the-third-engine-was-measured-and-retired.md with the
      # reasoning intact: TTS_COLD_LOAD_SECONDS_VOXTRAL=63,
      # TTS_REALTIME_FACTOR_RUNNER_VOXTRAL=0.104 and no local rate at all,
      # TTS_VOXTRAL_FLOW_STEPS=32 (chosen by ear over 16, 8 and 4, against an
      # upstream default of 8), TTS_VOXTRAL_CFG_ALPHA=1.2 (full guidance; 1.0
      # is documented upstream as faster and garbled), and the four runner-side
      # ones that never were keys here -- group_size 32, max_frames 2000,
      # fade_ms 120 and low_pass_hz 0. Anybody re-enabling the engine on a
      # bigger card starts from that list and not from the wrapper's defaults.
    cpus: 10
    mem_limit: 10g
    volumes:
      - tts-long-models:/models
      - tts-long-out:/output
      # THE RUNNER'S KEY, read-only, from a host path outside this repository.
      # TTS_RUNNER_API_KEY_FILE points here. The key is never in this file
      # because this file is published; the path is not a secret and the file
      # is 0400 owned by the uid this container runs as.
      - /mnt/tank/apps/stt-stack/runner-key:/run/secrets/runner-key:ro
      # READ-ONLY, and shared with voice-ui, which is the only writer. One
      # writer means there is no case where two processes race on the same
      # clip, and it means a compromise of the heaviest container in the estate
      # cannot plant a file the lighter one will serve.
      #
      # The registry rescans when this directory's mtime changes rather than
      # once at startup, so a clip written by voice-ui — or copied in over SMB —
      # is resolvable on the next request instead of after a restart that costs
      # a ~60 s model load.
      - voices:/voices:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      # 900 s because the model is 6.5 GB and lazily loaded, and roughly 3 GB
      # is downloaded on the very first job this container ever runs.
      start_period: 900s

  # ---------------------------------------------------------- the page --
  #
  # THE SECOND `ports` ENTRY IN THIS FILE, and the comment at the top of the
  # gateway block says one appearing means this file has stopped doing its job.
  # That sentence was written about 8000, 8001 and 8002 — three backends that
  # could be reached DIRECTLY, skipping the only process in the stack that
  # checks a token. Those three are still closed and still have no `ports`.
  #
  # This is a browser origin, not a bypass. voice-ui reaches voice-gateway and
  # nothing else; it holds no key LIST and compares no token; it asks the
  # gateway itself whether the credential in play is good; and it can answer
  # nothing the gateway would not have answered. If a future edit gives this
  # container a URL for stt-stack, tts-stack or tts-long, that is the moment
  # this paragraph stops being true.
  #
  # WHAT IS NO LONGER TRUE: "the boundary is exactly where it was". The page
  # used to carry the user's own key and this service forwarded it. With
  # UI_GATEWAY_API_KEY set below, this container holds the key and signs
  # requests with it, so THIS PORT is the trust boundary. Unset, it is the
  # passthrough it always was.
  voice-ui:
    container_name: voice-ui
    image: ghcr.io/gabrielbelli/calliope-ui:pre
    pull_policy: always
    restart: unless-stopped
    # NO PORTS. The gateway reaches this service on the app-internal network
    # and forwards `/`, `/ui/*` and `/ui/api/*` to it, so 30081 published
    # nothing that 30080 does not now serve -- and while it existed the
    # sentence at the top of this file about one door was only true of the
    # backends. Closing it is the same move as closing 8000/8001/8002, for the
    # same reason: a second door is a way round the process that checks tokens.
    expose:
      - "8090"
    environment:
      # A service name, on the app-internal network. The three backends are NOT
      # named here and must not be: this container talks to the gateway.
      # https, because the gateway serves only that now. See
      # config.GATEWAY_VERIFY for why verification is off on THIS hop and
      # nowhere else: the name `voice-gateway` is a compose service on this
      # app's bridge network, and no certificate for a public hostname can
      # match it. The published port still presents the real certificate.
      UI_GATEWAY_URL: https://voice-gateway:8080
      UI_GATEWAY_VERIFY: "0"

      # THE KEY THIS CONTAINER PRESENTS TO THE GATEWAY. Set it to one of the
      # values in GATEWAY_API_KEYS above.
      #
      # The page used to have an API key box: the browser held the key and this
      # service forwarded it. It does not any more — this is not a
      # bring-your-own-key tool — so if GATEWAY_API_KEYS is set and this is
      # not, the UI is 401 on every route and there is nowhere to type a key to
      # fix it.
      #
      # READ THIS BEFORE SETTING IT. It moves the trust boundary from 30080 to
      # 30081. Anyone who can open the page is authenticated BY the page,
      # because this process signs their requests for them, so publishing
      # 30081 somewhere 30080 is not already reachable from grants MORE access
      # rather than less. That is a fine trade for a tool on a LAN behind a
      # firewall and it is not one anywhere else. voice-ui logs a WARNING at
      # startup whenever this is set, saying exactly that.
      #
      # SET, and it MUST be set now that GATEWAY_API_KEYS is. The page has no
      # key box any more, so a gateway that requires a token and a UI that
      # presents none is 401 on every route with nowhere to type a fix.
      #
      # This is the SECOND key in GATEWAY_API_KEYS above, never the first: the
      # one a client holds and the one this container holds are different
      # secrets so that either can be rotated alone.
      # UI_GATEWAY_API_KEY: sk-second          # the SECOND key above, never the first
      # MeTube, by HOST ADDRESS. It is a separate TrueNAS app
      # (ix-metube-metube-1) with host_network:false and its web port published
      # on 30097, so it shares no DNS with this app — there is no `metube` name
      # to resolve, and `host.docker.internal` is absent without an explicit
      # extra_hosts entry. Put the NAS's LAN IP here.
      #
      # DELIBERATELY LEFT UNSET, like GATEWAY_API_KEYS above and for the same
      # reason: an address invented in a file that gets deployed is how a
      # placeholder becomes production configuration. Unset means the link box
      # is not rendered at all and the page says "link ingestion not
      # configured". File upload and both TTS paths never depend on it.
      #
      # BEFORE SETTING THIS, READ services/ui/README.md's security section.
      # MeTube has NO authentication of any kind — no auth, user, password or
      # token key exists in its configuration, and an unauthenticated GET
      # /history from off-NAS answers 200. Our path sits behind
      # GATEWAY_API_KEYS so this does not widen that hole, but it does make it
      # load-bearing, and the fix is a deployment one: unpublish 30097 or
      # firewall it to the NAS and reach it by LAN IP.
      #
      # SET, and by LAN IP rather than through the reverse proxy. This call
      # never leaves the NAS: sending it to ytdl.gabrielbelli.com would go out
      # to the router on 192.168.1.1 and hairpin straight back to this machine,
      # adding HAProxy and a TLS handshake as failure modes for a hop between
      # two containers on the same box. That proxy is also, at the time of
      # writing, returning HAProxy's "No server is available" 503 for that
      # hostname while MeTube answers 200 on 30097 — a backend pointing at
      # MeTube's DOCUMENTED default port 8081, which TrueNAS does not publish:
      # `docker port ix-metube-metube-1` shows 30097/tcp -> 0.0.0.0:30097 and
      # nothing on 8081.
      UI_METUBE_URL: http://192.168.1.111:30097

      # Ingest files land here rather than in the middle of the user's music
      # library. MeTube's AUDIO_DOWNLOAD_DIR defaults to %%DOWNLOAD_DIR and is
      # unset on this deployment, so /download/ and /audio_download/ are the
      # SAME directory; CUSTOM_DIRS and CREATE_CUSTOM_DIRS both default true,
      # so MeTube creates it for us.
      UI_METUBE_FOLDER: stt-ingest
      UI_VOICE_DIR: /voices
    # 1 CPU and 384 MB. This process serves one HTML file, streams bytes
    # between two sockets and occasionally spawns a yt-dlp probe that reads a
    # page of JSON. Nothing is buffered: the ingest path streams MeTube's file
    # straight into a multipart POST rather than holding 131 MB of podcast, and
    # audio decoding happens in the browser. The image has no torch, no numpy
    # and no ffmpeg.
    cpus: 1
    mem_limit: 384m
    volumes:
      # The reference-clip store, and it is NOT optional. Without a named
      # volume every cloned voice survives until the next restart and no
      # further, which is worse than not shipping the feature. voice-ui is the
      # only writer; tts-long mounts the same volume read-only below.
      - voices:/voices
    healthcheck:
      # Its OWN localhost, like every service here. This endpoint answers 200
      # even when the gateway is down — it reports that in the body instead. A
      # UI killed by the orchestrator because tts-long was restarting would be
      # gone at exactly the moment someone wanted to open the page and find out
      # why.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 60s
      timeout: 30s
      retries: 3
      # Seconds, not minutes: there is no model to load here either.
      start_period: 30s
    # No depends_on, for the gateway's reason: the page must be reachable
    # during a cold start, because that is exactly when someone wants to look
    # at the health pills and find out what is still loading.


# Unchanged, and named here so the deploy does not create new empty ones and
# silently orphan the models already on disk.
#
# `voices` is the one addition. The deployed compose mounted no voice volume at
# all, so tts-long's registry was ["default"] only and all thirteen OpenAI
# names aliased to the built-in speaker. Every cloned voice would have died on
# the next restart without it.
volumes:
  stt-models:
  # `stt-glossaries` is the second addition, and the same argument as `voices`
  # one paragraph up: the deployed compose mounted no glossary volume at all,
  # so /glossaries did not exist in the container, `writable` was false and
  # every PUT and DELETE answered 503. Without it a profile written over the
  # API would land in the container's writable layer and die on the next
  # `pull_policy: always` restart, which is why the service refuses rather
  # than accepts.
  stt-glossaries:
  tts-models:
  tts-long-models:
  tts-long-out:
  voices:
