name: test

# No image to build here — this is a source tarball the three services fetch by
# commit SHA. What CI has to prove is that the package installs and that its
# own tests, including the conformance suite it ships, pass on the interpreter
# versions the consumers run: 3.12 for tts-long, whose resemble-perth needs
# pkg_resources, and 3.13 for the other two.
on:
  push:
    branches: [main, prerelease]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        # The same fastapi the three services pin, so a version skew shows up
        # here rather than in a consumer's build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[audio,conformance]' 'fastapi==0.121.2'

      - name: Test
        run: python -m pytest -q

      - name: Check the sdist builds
        # This is what a consumer's `pip install <tarball>` actually does, and
        # it is the one failure mode a passing test run would not catch.
        run: |
          python -m pip install build
          python -m build --sdist
          python -m pip install dist/*.tar.gz --force-reinstall --no-deps
          test -x "$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))')/voice-entrypoint.sh"
