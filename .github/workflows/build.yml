name: build

# Pre-release lives on `prerelease`; `main` carries only validated versions.
# Images from `prerelease` are tagged :pre and :pre-<sha> and never :latest,
# so pulling the default tag can never pick up an unvalidated build.
on:
  push:
    branches: [main, prerelease]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tts-long
  # buildah's overlay driver leaves overlayfs bookkeeping xattrs on directories
  # a COPY merges into. vfs produces none. Same reason as the FreeBSD images.
  STORAGE_DRIVER: vfs

jobs:
  # The suite voice-common ships, run against this repo's own app.main:app.
  # Its whole point is that a bad voice-common bump fails here rather than on
  # the host, so it runs before the image is worth building — and it needs
  # neither torch nor a model, which is what keeps it cheap enough to keep.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 3.12 because that is what the image runs; see the Containerfile.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ffmpeg for the three lossy formats. The encoder tests skip without it
      # and the suite still passes, but skipping the format the schema
      # DEFAULTS to would leave the most-used path unasserted in CI.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Not `-r requirements.txt`: chatterbox and the CPU torch wheel are
      # gigabytes and nothing asserted below imports either. app.synth imports
      # them lazily, inside _ensure_loaded, precisely so this is possible.
      # uvicorn is here for one test and one test only — the streaming one
      # measures time-to-first-byte, which needs a real socket because
      # TestClient runs the application to completion before it answers.
      - name: Install what the suite actually imports
        run: |
          pip install pytest \
            "$(grep '^voice-common' requirements.txt | sed 's/\[audio\]/[audio,conformance]/')" \
            "$(grep '^fastapi==' requirements.txt)" \
            "$(grep '^soundfile==' requirements.txt)" \
            "$(grep '^uvicorn' requirements.txt)"

      - name: Run the suite
        run: python -m pytest tests -v

  build:
    needs: conformance
    # Native runners per architecture rather than qemu. This image has RUN
    # instructions (apt, pip), and emulated arm64 pip installs take tens of
    # minutes where a native runner takes two.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Build
        run: |
          buildah bud \
            --platform "linux/${{ matrix.arch }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.licenses=BSD-2-Clause" \
            --annotation "org.opencontainers.image.base.name=docker.io/library/python:3.13-slim-trixie" \
            -t "localhost/build:${{ matrix.arch }}" \
            -f Containerfile .

      # The image is useless if the runtime cannot import, and that only shows
      # up at run time — onnxruntime ships per-architecture wheels and a
      # missing arm64 wheel would build fine and fail on first request.
      - name: Check the runtime imports on this architecture
        run: |
          buildah run --user root "$(buildah from localhost/build:${{ matrix.arch }})" -- \
            python -c 'import torch, chatterbox, soundfile; print("ok", torch.__version__)'

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      - name: Push the per-architecture tag
        if: github.event_name != 'pull_request'
        run: |
          buildah push "localhost/build:${{ matrix.arch }}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Log in to the registry
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      # Which moving tags this ref is allowed to publish. `main` owns :latest;
      # `prerelease` owns :pre and must never touch :latest. A tag push
      # publishes its own version and, being cut from main, :latest as well.
      - name: Assemble the multi-architecture tags
        run: |
          set -eu
          dest="${REGISTRY}/${IMAGE_NAME}"

          buildah manifest create m
          for arch in amd64 arm64; do
            buildah manifest add m "docker://${dest}:${GITHUB_SHA}-${arch}"
          done

          case "$GITHUB_REF" in
            refs/heads/main)
              buildah manifest push --all m "docker://${dest}:latest"
              buildah manifest push --all m "docker://${dest}:main-${GITHUB_SHA}"
              ;;
            refs/heads/prerelease)
              buildah manifest push --all m "docker://${dest}:pre"
              buildah manifest push --all m "docker://${dest}:pre-${GITHUB_SHA}"
              ;;
            refs/tags/*)
              buildah manifest push --all m "docker://${dest}:${GITHUB_REF#refs/tags/}"
              buildah manifest push --all m "docker://${dest}:latest"
              ;;
          esac
