name: build

# Pre-release lives on `prerelease`; `main` carries only validated versions.
# Images from `prerelease` are tagged :pre and :pre-<sha> and never :latest,
# so pulling the default tag can never pick up an unvalidated build.
on:
  push:
    branches: [main, prerelease]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/stt-stack
  # buildah's overlay driver leaves overlayfs bookkeeping xattrs on directories
  # a COPY merges into. vfs produces none. Same reason as the FreeBSD images.
  STORAGE_DRIVER: vfs

jobs:
  # voice-common ships the assertions for the wire contract this service shares
  # with tts-stack and tts-long, and they run here against the app this repo
  # actually builds. That is what makes the SHA pin in requirements.txt safe to
  # bump: a bad one fails here rather than in production. No model is
  # downloaded — the suite never runs the app's lifespan.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # the version the image is built on

      - name: Install
        run: pip install -r requirements.txt pytest httpx

      - name: Run voice-common's conformance suite
        run: python -m pytest tests -q

  build:
    needs: conformance
    # Native runners per architecture rather than qemu. This image has RUN
    # instructions (apt, pip), and emulated arm64 pip installs take tens of
    # minutes where a native runner takes two.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Build
        run: |
          buildah bud \
            --platform "linux/${{ matrix.arch }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.licenses=BSD-2-Clause" \
            --annotation "org.opencontainers.image.base.name=docker.io/library/python:3.13-slim-trixie" \
            -t "localhost/build:${{ matrix.arch }}" \
            -f Containerfile .

      # The image is useless if the model runtime cannot import, and that only
      # shows up at run time — onnxruntime ships per-architecture wheels and a
      # missing arm64 wheel would build fine and fail on first request.
      - name: Check the runtime imports on this architecture
        run: |
          buildah run --user root "$(buildah from localhost/build:${{ matrix.arch }})" -- \
            python -c "import onnx_asr, onnxruntime, soundfile, faster_whisper, ctranslate2; print('ok', onnxruntime.__version__, ctranslate2.__version__)"

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      - name: Push the per-architecture tag
        if: github.event_name != 'pull_request'
        run: |
          buildah push "localhost/build:${{ matrix.arch }}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Log in to the registry
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      # Which moving tags this ref is allowed to publish. `main` owns :latest;
      # `prerelease` owns :pre and must never touch :latest. A tag push
      # publishes its own version and, being cut from main, :latest as well.
      - name: Assemble the multi-architecture tags
        run: |
          set -eu
          dest="${REGISTRY}/${IMAGE_NAME}"

          buildah manifest create m
          for arch in amd64 arm64; do
            buildah manifest add m "docker://${dest}:${GITHUB_SHA}-${arch}"
          done

          case "$GITHUB_REF" in
            refs/heads/main)
              buildah manifest push --all m "docker://${dest}:latest"
              buildah manifest push --all m "docker://${dest}:main-${GITHUB_SHA}"
              ;;
            refs/heads/prerelease)
              buildah manifest push --all m "docker://${dest}:pre"
              buildah manifest push --all m "docker://${dest}:pre-${GITHUB_SHA}"
              ;;
            refs/tags/*)
              buildah manifest push --all m "docker://${dest}:${GITHUB_REF#refs/tags/}"
              buildah manifest push --all m "docker://${dest}:latest"
              ;;
          esac
