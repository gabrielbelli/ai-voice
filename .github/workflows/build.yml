name: build

# Pre-release lives on `prerelease`; `main` carries only validated versions.
# Images from `prerelease` are tagged :pre and :pre-<sha> and never :latest,
# so pulling the default tag can never pick up an unvalidated build.
on:
  push:
    branches: [main, prerelease]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tts-stack
  # buildah's overlay driver leaves overlayfs bookkeeping xattrs on directories
  # a COPY merges into. vfs produces none. Same reason as the FreeBSD images.
  STORAGE_DRIVER: vfs

jobs:
  # voice-common ships the assertions as well as the code, and this job runs
  # them against the app object this repo actually builds. It is the answer to
  # "a shared package now has three consumers": a bad bump fails at the
  # consumer's build rather than on the box serving port 8001.
  #
  # Deliberately no model. The suite never enters the app's lifespan, so
  # nothing here downloads the 340 MB of weights, and the whole job is under a
  # minute on one runner. The ENCODERS are a different matter: they are real,
  # they are the thing under test, and they are not a pip install. See below.
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # ffmpeg is a runtime dependency pip cannot supply, and this job ran
      # without it. The Containerfile installs it; this runner did not, and
      # ubuntu-24.04 does not carry it as standard.
      #
      # That is not a cosmetic gap. `response_format` defaults to mp3 — the
      # schema's default and OpenAI's — and every format but wav and pcm is
      # encoded by feeding ffmpeg on a pipe, so the DEFAULT request shape
      # cannot be answered at all without the binary. Popen raised
      # FileNotFoundError, the route returned 500, and three tests that are
      # about headers and validation rather than audio failed on it:
      # test_the_speed_clamp_is_announced and test_ignored_parameters_are_named
      # with KeyError on the header they assert, because a 500 carries neither,
      # and test_stream_format_is_validated_against_its_enum on
      # `stream_format: "audio"` — the spec default — coming back 500 not 200.
      #
      # It also silently gutted the run. The tests that encode are marked
      # `needs_ffmpeg` and skipped themselves: 17 skipped without it against 1
      # with, so the suite reported success over a third of itself never
      # having run.
      - name: Install ffmpeg, which the encoders shell out to
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the runtime and the conformance extra
        run: pip install -r requirements-dev.txt
      # `python -m pytest`, not `pytest`: the module form puts the working
      # directory on sys.path, and without it `import app.main` fails with
      # ModuleNotFoundError. This repo is a plain source tree, not an
      # installed package, so there is nothing else to find `app` by.
      - name: Run voice-common's conformance suite against this app
        run: python -m pytest tests/ -q

  build:
    needs: conformance
    # Native runners per architecture rather than qemu. This image has RUN
    # instructions (apt, pip), and emulated arm64 pip installs take tens of
    # minutes where a native runner takes two.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Build
        run: |
          buildah bud \
            --platform "linux/${{ matrix.arch }}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "org.opencontainers.image.licenses=BSD-2-Clause" \
            --annotation "org.opencontainers.image.base.name=docker.io/library/python:3.13-slim-trixie" \
            -t "localhost/build:${{ matrix.arch }}" \
            -f Containerfile .

      # The image is useless if the runtime cannot import, and that only shows
      # up at run time — onnxruntime ships per-architecture wheels and a
      # missing arm64 wheel would build fine and fail on first request.
      - name: Check the runtime imports on this architecture
        run: |
          buildah run --user root "$(buildah from localhost/build:${{ matrix.arch }})" -- \
            python -c 'import kokoro_onnx, onnxruntime, soundfile; print("ok", onnxruntime.__version__)'

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      - name: Push the per-architecture tag
        if: github.event_name != 'pull_request'
        run: |
          buildah push "localhost/build:${{ matrix.arch }}" \
            "docker://${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Log in to the registry
        run: buildah login -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}" "${REGISTRY}"

      # Which moving tags this ref is allowed to publish. `main` owns :latest;
      # `prerelease` owns :pre and must never touch :latest. A tag push
      # publishes its own version and, being cut from main, :latest as well.
      - name: Assemble the multi-architecture tags
        run: |
          set -eu
          dest="${REGISTRY}/${IMAGE_NAME}"

          buildah manifest create m
          for arch in amd64 arm64; do
            buildah manifest add m "docker://${dest}:${GITHUB_SHA}-${arch}"
          done

          case "$GITHUB_REF" in
            refs/heads/main)
              buildah manifest push --all m "docker://${dest}:latest"
              buildah manifest push --all m "docker://${dest}:main-${GITHUB_SHA}"
              ;;
            refs/heads/prerelease)
              buildah manifest push --all m "docker://${dest}:pre"
              buildah manifest push --all m "docker://${dest}:pre-${GITHUB_SHA}"
              ;;
            refs/tags/*)
              buildah manifest push --all m "docker://${dest}:${GITHUB_REF#refs/tags/}"
              buildah manifest push --all m "docker://${dest}:latest"
              ;;
          esac
